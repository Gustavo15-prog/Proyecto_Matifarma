<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: head('Ventas')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/ventas.css}">
</head>
<body>
<div class="app-shell">
  <th:block th:replace="~{fragments/layout :: sidebar('ventas')}"></th:block>
  <div class="app-main">
    <header th:replace="~{fragments/layout :: topbar('Ventas')}"></header>
    <main class="app-content">
      <div class="row g-3">
        <div class="col-xl-8">
          <div class="panel mb-3">
            <h2 class="panel-title">Agregar productos</h2>
            <div class="buscador"><i class="bi bi-search"></i>
              <input type="search" class="form-control form-control-lg" id="buscarVenta" placeholder="Busque por nombre o código del producto…" maxlength="60" autocomplete="off" aria-label="Buscar producto a vender" autofocus>
              <div class="resultados-busqueda" id="listaVenta" role="listbox" hidden></div></div>
          </div>
          <div class="panel panel-flush">
            <div class="table-responsive"><table class="table table-mf">
              <thead><tr><th>Producto</th><th class="num">Precio</th><th style="width:150px">Cantidad</th><th class="num">Subtotal</th><th></th></tr></thead>
              <tbody id="tbCarrito"></tbody></table></div>
          </div>
        </div>

        <div class="col-xl-4">
          <div class="panel ticket">
            <h2 class="panel-title">Datos de la venta</h2>
            <form id="formVenta" novalidate autocomplete="off">
              <div class="mb-3"><label for="tipoPago" class="form-label req">Tipo de pago</label>
                <select class="form-select" id="tipoPago" name="tipoPago"><option>EFECTIVO</option><option>YAPE</option><option>PLIN</option><option>TARJETA</option></select></div>
              <div class="row g-2 mb-3">
                <div class="col-5"><label for="clienteDocumento" class="form-label">DNI / RUC</label><input class="form-control" id="clienteDocumento" name="clienteDocumento" maxlength="12" inputmode="numeric"></div>
                <div class="col-7"><label for="clienteNombre" class="form-label">Cliente</label><input class="form-control" id="clienteNombre" name="clienteNombre" maxlength="120" placeholder="Opcional"></div>
              </div>
            </form>
            <div class="total-box">
              <div class="d-flex justify-content-between"><span>Productos</span><strong id="totItems">0</strong></div>
              <div class="d-flex justify-content-between align-items-baseline mt-1"><span class="fw-bold">Total a cobrar</span><strong class="total-monto" id="totMonto">S/ 0.00</strong></div>
            </div>
            <button type="button" class="btn btn-accent btn-lg w-100 mt-3" id="btnConfirmar"><i class="bi bi-check2-circle me-1"></i>Confirmar venta</button>
            <button type="button" class="btn btn-link w-100 mt-1 text-muted" id="btnLimpiar">Vaciar carrito</button>
          </div>
        </div>
      </div>

      <div class="panel panel-flush mt-3">
        <div class="toolbar"><h2 class="panel-title mb-0">Ventas recientes</h2></div>
        <div class="table-responsive"><table class="table table-mf">
          <thead><tr><th>N.º</th><th>Fecha</th><th>Cliente</th><th>Pago</th><th>Vendedor</th><th class="num">Total</th><th></th></tr></thead>
          <tbody id="tbRecientes"><tr><td colspan="7" class="vacio">Cargando…</td></tr></tbody></table></div>
      </div>
    </main>
  </div>
</div>

<!-- Comprobante -->
<div class="modal fade" id="modalComprobante" tabindex="-1" aria-labelledby="tituloComprobante" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title" id="tituloComprobante">Comprobante de venta</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
    <div class="modal-body"><div id="comprobante"></div></div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cerrar</button><button type="button" class="btn btn-accent" id="btnImprimir"><i class="bi bi-printer me-1"></i>Imprimir</button></div>
  </div></div>
</div>

<th:block th:replace="~{fragments/layout :: scriptsBase}"></th:block>
<script th:src="@{/js/validaciones.js}"></script>
<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/buscador-productos.js}"></script>
<script th:src="@{/js/ventas.js}"></script>
</body>
</html>
