<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: head('Proveedores')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/proveedores.css}">
</head>
<body>
<div class="app-shell">
  <th:block th:replace="~{fragments/layout :: sidebar('proveedores')}"></th:block>
  <div class="app-main">
    <header th:replace="~{fragments/layout :: topbar('Proveedores')}"></header>
    <main class="app-content">
      <div class="page-head">
        <p>Administre los proveedores que abastecen la botica.</p>
        <button type="button" class="btn btn-accent" id="btnNuevo"><i class="bi bi-plus-lg me-1"></i>Nuevo proveedor</button>
      </div>
      <div class="panel panel-flush">
        <div class="toolbar">
          <div class="search"><i class="bi bi-search"></i>
            <input type="search" id="txtBuscar" class="form-control" placeholder="Buscar por razón social o RUC…" maxlength="60" aria-label="Buscar proveedor"></div>
          <span class="ms-auto text-muted small" id="contador"></span>
        </div>
        <div class="table-responsive">
          <table class="table table-mf">
            <thead><tr><th>Razón social</th><th>RUC</th><th>Teléfono</th><th>Correo</th><th>Dirección</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
            <tbody id="tbody"><tr><td colspan="7" class="vacio">Cargando…</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal fade" id="modalProveedor" tabindex="-1" aria-labelledby="tituloProveedor" aria-hidden="true">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title" id="tituloProveedor">Nuevo proveedor</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
    <div class="modal-body">
      <form id="formProveedor" novalidate autocomplete="off"><div class="row g-3">
        <div class="col-md-8"><label for="razonSocial" class="form-label req">Razón social</label><input class="form-control" id="razonSocial" name="razonSocial" maxlength="150"></div>
        <div class="col-md-4"><label for="ruc" class="form-label req">RUC</label><input class="form-control" id="ruc" name="ruc" maxlength="11" inputmode="numeric" placeholder="11 dígitos"></div>
        <div class="col-md-5"><label for="telefono" class="form-label req">Teléfono</label><input class="form-control" id="telefono" name="telefono" maxlength="20" inputmode="tel"></div>
        <div class="col-md-7"><label for="correo" class="form-label">Correo electrónico</label><input class="form-control" type="email" id="correo" name="correo" maxlength="120"></div>
        <div class="col-12"><label for="direccion" class="form-label">Dirección</label><input class="form-control" id="direccion" name="direccion" maxlength="200"></div>
      </div></form>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-accent" id="btnGuardar">Guardar proveedor</button></div>
  </div></div>
</div>

<th:block th:replace="~{fragments/layout :: scriptsBase}"></th:block>
<script th:src="@{/js/validaciones.js}"></script>
<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/proveedores.js}"></script>
</body>
</html>
