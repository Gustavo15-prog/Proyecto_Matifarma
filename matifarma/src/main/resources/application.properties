spring.application.name=matifarma
server.port=8080
server.servlet.session.timeout=30m

# ---- SQL Server (puede sobrescribirse con variables de entorno) ----
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:matifarma};encrypt=true;trustServerCertificate=${DB_TRUST_CERT:true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=10

# true en producción; use THYMELEAF_CACHE=false solo mientras desarrolla
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.mvc.throw-exception-if-no-handler-found=false

# ---- Reglas del sistema ----
matifarma.admin.usuario=admin
matifarma.admin.correo=admin@matifarma.pe
matifarma.admin.nombres=Administrador Matifarma
# Si ADMIN_PASSWORD no está definida, se genera una contraseña aleatoria y se muestra una vez en el log
matifarma.admin.password=${ADMIN_PASSWORD:}
matifarma.alertas.dias-vencimiento=30
matifarma.seguridad.max-intentos=5
matifarma.seguridad.bloqueo-minutos=15
